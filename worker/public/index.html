<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cloud Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0e">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cloud Player">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="topbar">
  <h1>Cloud Player</h1>
  <div class="topbar-actions">
    <button id="btn-upload" class="icon-button" type="button" aria-label="Add music">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17V4m0 0L7.5 8.5M12 4l4.5 4.5M4 16v2.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V16"/></svg>
    </button>
    <button id="btn-auth" class="icon-button" type="button" aria-label="Sign in">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="9.5" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>
    </button>
  </div>
  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
    <input id="search" type="search" placeholder="Search library" autocomplete="off"
           autocorrect="off" autocapitalize="none" spellcheck="false" aria-label="Search library">
  </div>
</header>

<main id="main">
  <p id="status" class="status" role="status" aria-live="polite" hidden></p>
  <ul id="library" class="library"></ul>
  <p id="empty" class="empty" hidden></p>
</main>

<footer id="player" class="player" hidden>
  <div class="player-top">
    <div id="np-art" class="art art-sm" aria-hidden="true"></div>
    <div class="np-text">
      <span id="np-title" class="np-title"></span>
      <span id="np-artist" class="np-artist"></span>
    </div>
    <div class="transport">
      <button id="btn-prev" class="icon-button" type="button" aria-label="Previous track">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6.5v11L9.5 12z" class="fill"/><path d="M6.5 6v12"/></svg>
      </button>
      <button id="btn-play" class="icon-button play" type="button" aria-label="Play">
        <svg id="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13L19 12z" class="fill"/></svg>
        <svg id="icon-pause" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M8.5 5.5v13M15.5 5.5v13"/></svg>
      </button>
      <button id="btn-next" class="icon-button" type="button" aria-label="Next track">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6.5v11L14.5 12z" class="fill"/><path d="M17.5 6v12"/></svg>
      </button>
    </div>
  </div>
  <div class="player-bottom">
    <button id="btn-shuffle" class="icon-button tiny" type="button" aria-label="Shuffle" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h3.5l3 5m5 0 2.5-5H21m0 0-2.5-2.5M21 7l-2.5 2.5M3 17h3.5l3-5m5 0 2.5 5H21m0 0-2.5 2.5M21 17l-2.5-2.5"/></svg>
    </button>
    <span id="time-current" class="time">0:00</span>
    <input id="seek" class="seek" type="range" min="0" max="1000" value="0" step="1"
           aria-label="Seek" disabled>
    <span id="time-total" class="time">0:00</span>
    <button id="btn-repeat" class="icon-button tiny" type="button" aria-label="Repeat off">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h10a4 4 0 0 1 4 4v1M7 5 10 2M7 5l3 3m7 11H7a4 4 0 0 1-4-4v-1m14 5-3 3m3-3-3-3"/></svg>
      <span id="repeat-one" class="badge" hidden>1</span>
    </button>
  </div>
</footer>

<!-- Deliberately no accept attribute. iOS maps accept to UTIs for the Files
     picker, and audio that arrived by download or from a third-party provider
     often carries a generic public.data UTI, which greys out perfectly valid
     MP3s. app.js checks the extension instead, and the VM rejects anything
     unsupported with a 400. -->
<input id="file-input" type="file" multiple hidden>

<div id="sheet" class="sheet-backdrop" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h2 id="sheet-title"></h2>
    <div id="sheet-body"></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
